name: Build tool index

# Run whenever a tool is added, edited, moved, or archived.
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'archive/**'
      - 'scripts/build-index.mjs'
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

# Lets the job push the regenerated tools.json back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the script can read commit dates

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild tools.json
        run: node scripts/build-index.mjs

      - name: Commit if it changed
        run: |
          git config user.name  "tools-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "rebuild tool index"
          git push
