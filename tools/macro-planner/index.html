<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Macro Planner</title>
  <meta name="description" content="Plan routine meals, track four macros">
  <meta name="icon" content="chart">
  <meta name="tags" content="health, nutrition, fitness">
  <!-- Paths stay relative because the app lives under the dashboard's subpath; og:image alone must be absolute. -->
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1A18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Macros">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:title" content="Macro Planner">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://tannercheek.github.io/tools/tools/macro-planner/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <!-- One stylesheet per js/ui/ module, and one for js/rings.js, loaded before style.css so view styles can build on them. -->
  <link rel="stylesheet" href="components/buttons.css">
  <link rel="stylesheet" href="components/row.css">
  <link rel="stylesheet" href="components/inputs.css">
  <link rel="stylesheet" href="components/controls.css">
  <link rel="stylesheet" href="components/sheet.css">
  <link rel="stylesheet" href="components/emoji-picker.css">
  <link rel="stylesheet" href="components/empty-state.css">
  <link rel="stylesheet" href="components/totals-card.css">
  <link rel="stylesheet" href="components/rings.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Hidden until persist.js's passphrase gate passes and storage is ready. -->
  <div id="app" hidden>
    <header id="header" class="app-header"></header>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Tabs"></nav>
  </div>
</body>
</html>
